name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      # WhisperLocal itself cannot run here: MLX, the menu bar and the global
      # hotkey all need an Apple Silicon Mac. This job only proves the package
      # is well-formed and the source is syntactically valid.
      - name: Build the package
        run: uv build

      - name: Byte-compile all sources
        run: uv run --no-project python -m compileall -q src/

      - name: Check the installer scripts
        run: |
          bash -n install.sh
          bash -n uninstall.sh

      - name: Lint the shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning install.sh uninstall.sh
